<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hello from tshare</title>
<style>
  body { font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         max-width: 34rem; margin: 4rem auto; padding: 0 1.25rem; }
  code { background: #8881; padding: .15em .4em; border-radius: .3em; }
  #status { white-space: pre-wrap; }
</style>

<h1>It works 👋</h1>
<p>This page and the JSON API are the same Node server, on the same share path.</p>
<p>Live from <code>api/status</code>: <span id="status">…</span></p>

<script>
  // Relative URL on purpose: the share lives under /<token>/, so "api/status"
  // resolves inside it while "/api/status" would escape the mount.
  fetch('api/status')
    .then((r) => r.json())
    .then((d) => { status.textContent = `up ${d.uptimeSeconds.toFixed(1)}s (since ${d.started})`; })
    .catch((e) => { status.textContent = String(e); });
</script>
